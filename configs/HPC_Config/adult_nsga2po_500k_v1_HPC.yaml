# NSGA-II-PO + equalized-odds fairness on Adult income -- Rocket 500k v1.

dataset: adult
task_type: classification
seed: 0

output_dir: outputs/hpc/adult_nsga2po_500k_v1/seed_0

prompt_pool: configs/phase2_prompt_pool_adult.yaml

task_description: >
  Each item is a person record from the Adult income dataset rendered as text.
  Predict whether annual income is <=50K or >50K using employment, education,
  working-hours, and financial evidence. Sex and race are protected attributes
  used only for fairness evaluation.

labels:
  - "<=50K"
  - ">50K"

dev:
  dataset: adult
  data_path: data/adult.csv
  dev_size: 400
  shots_size: 100
  test_size: 1000
  stratified: true
  stratify_group_key: sex
  allow_smaller: false

llm:
  backend: lmstudio
  model_id: mistralai/mistral-small-3.2
  api_url: http://localhost:1234/v1
  temperature: 0.0
  num_predict: 16
  timeout: 900

evaluation:
  use_llm: true
  require_final_answer_tags: true

cost:
  input_weight: 0.08
  output_weight: 0.32

fairness:
  in_loop: true
  mode: equalized_odds
  group_key: sex
  positive_label: ">50K"
  group_gap_weight: 0.0
  demographic_parity_weight: 0.0
  equal_opportunity_weight: 0.0
  equalized_odds_weight: 1.0
  flip_weight: 0.0
  bias_weight: 0.0
  debt_weight: 0.0

few_shot:
  enabled: true
  few_shot_probability: 0.3
  max_few_shot_examples: 3
  pool_size: 100
  use_rationale: false
  shots_data: adult
  data_path: data/adult.csv
  stratified: true
  stratify_group_key: sex

budget:
  unit: tokens
  max_budget: 500000.0
  allow_overspend: false

nsga2_po:
  population_size: 12
  max_generations: 4
  offspring_per_generation: 3
  crossover_probability: 1.0
  mutation_probability: 1.0
  mutate_after_crossover: true
  use_meta_llm: true
  objectives:
    - performance
    - cost
    - fairness_risk

routing_preferences:
  - name: accuracy_first
    mode: accuracy_first
  - name: cost_first
    mode: cost_first
  - name: fairness_first
    mode: fairness_first
  - name: balanced
    mode: balanced
    performance: 1.0
    cost: 0.3
    fairness: 1.0
