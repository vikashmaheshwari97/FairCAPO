# MO-CAPO fairness-off ablation on Adult income -- Rocket 500k v1.

dataset: adult
task_type: classification
seed: 0

output_dir: outputs/hpc/adult_ablation_500k_v1/seed_0

prompt_pool: configs/phase2_prompt_pool_adult.yaml

task_description: >
  Each item is a person record from the Adult income dataset rendered as text.
  Predict whether annual income is <=50K or >50K using employment, education,
  working-hours, and financial evidence.

labels:
  - "<=50K"
  - ">50K"

dev:
  dataset: adult
  data_path: data/adult.csv
  dev_size: 400
  shots_size: 100
  test_size: 1000
  stratified: true
  stratify_group_key: sex
  allow_smaller: false

llm:
  backend: lmstudio
  model_id: mistralai/mistral-small-3.2
  api_url: http://localhost:1234/v1
  temperature: 0.0
  num_predict: 16
  timeout: 900

evaluation:
  use_llm: true
  require_final_answer_tags: true

cost:
  input_weight: 0.08
  output_weight: 0.32

fairness:
  in_loop: false
  mode: equalized_odds
  group_key: sex
  positive_label: ">50K"
  equalized_odds_weight: 1.0

few_shot:
  enabled: true
  few_shot_probability: 0.3
  max_few_shot_examples: 3
  pool_size: 100
  use_rationale: false
  shots_data: adult
  data_path: data/adult.csv
  stratified: true
  stratify_group_key: sex

block_size: 100
drop_last_block: false
num_seed_blocks: 1

budget:
  unit: tokens
  max_budget: 500000.0
  allow_overspend: false

evolutionary:
  population_size: 12
  max_iterations: 6
  offspring_per_iteration: 3
  crossover_probability: 1.0
  mutation_probability: 1.0
  mutate_after_crossover: true
  use_meta_llm: true
  require_prompt_tags: true
  preserve_output_format: true
  advance_after_iteration: true

intensification:
  max_blocks_per_challenger: 4
  reject_when_dominated: true
  accept_when_not_dominated_on_common_blocks: true
  add_rejected_to_population: true
  use_cache: true

routing_preferences:
  - name: accuracy_first
    mode: accuracy_first
  - name: cost_first
    mode: cost_first
  - name: balanced
    mode: balanced
    performance: 1.0
    cost: 0.3
