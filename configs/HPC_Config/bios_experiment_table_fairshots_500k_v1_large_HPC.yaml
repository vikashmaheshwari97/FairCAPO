# Diagnostic table -- Bias-in-Bios Rocket 500k fair-shots seed 0, large held-out only.
#
# Compares the new FairCAPO fair-shots run against the frozen Mistral BIOS v1
# baselines. Keep the original v1 table as the main result until fair-shots is
# proven better on large-held-out evaluation.

output_dir: outputs/experiment_table/bios_mistral_hpc_fairshots_500k_v1_large_seed0
dataset: Bias-in-Bios
model: mistralai/mistral-small-3.2
seed: 0

objectives:
  - name: performance
    direction: maximize
  - name: cost
    direction: minimize
  - name: risk
    direction: minimize
  - name: fairness_risk
    direction: minimize

bounds:
  performance: [0.0, 1.0]
  cost: [0.0, 12000.0]
  risk: [0.0, 1.0]
  fairness_risk: [0.0, 1.0]

metrics:
  num_preference_vectors: 500
  seed: 0

methods:
  - name: FairCAPO fair-shots
    type: pareto_set
    candidates_csv: outputs/hpc/evaluation_large/seed_0/bios_faircapo_fairshots_500k_v1/test_eval_candidates.csv
    only_pareto: true
    budget_json: outputs/hpc/bios_faircapo_fairshots_500k_v1/seed_0/budget_summary.json
    holdout_csv: outputs/hpc/evaluation_large/seed_0/bios_faircapo_fairshots_500k_v1/test_eval_candidates.csv

  - name: FairCAPO Mistral v1
    type: pareto_set
    candidates_csv: outputs/hpc/evaluation_large/seed_0/bios_faircapo_500k_v1/test_eval_candidates.csv
    only_pareto: true
    budget_json: outputs/hpc/bios_faircapo_500k_v1/seed_0/budget_summary.json
    holdout_csv: outputs/hpc/evaluation_large/seed_0/bios_faircapo_500k_v1/test_eval_candidates.csv

  - name: MO-CAPO (fairness off)
    type: pareto_set
    candidates_csv: outputs/hpc/evaluation_large/seed_0/bios_ablation_500k_v1/test_eval_candidates.csv
    only_pareto: true
    budget_json: outputs/hpc/bios_ablation_500k_v1/seed_0/budget_summary.json
    holdout_csv: outputs/hpc/evaluation_large/seed_0/bios_ablation_500k_v1/test_eval_candidates.csv

  - name: NSGA-II-PO + fairness
    type: pareto_set
    candidates_csv: outputs/hpc/evaluation_large/seed_0/bios_nsga2po_500k_v1/test_eval_candidates.csv
    only_pareto: true
    holdout_csv: outputs/hpc/evaluation_large/seed_0/bios_nsga2po_500k_v1/test_eval_candidates.csv
