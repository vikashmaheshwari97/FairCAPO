# Aggregate Adult large-held-out Dtest results from the Rocket layout.

base: outputs/hpc/evaluation_large/seed_{seed}
seeds: [0]
output_dir: outputs/experiment_table/adult_mistral_hpc_500k_v1_large_seed0

methods:
  - name: FairCAPO
    eval_subdir: adult_faircapo_500k_v1
  - name: MO-CAPO (fairness off)
    eval_subdir: adult_ablation_500k_v1
  - name: NSGA-II-PO + fairness
    eval_subdir: adult_nsga2po_500k_v1
