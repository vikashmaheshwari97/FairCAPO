# few_shot_probability 0.5, eval_pairs 40, max_blocks 8) at the 1000k_v2
# token budget. See the generator docstring for the full rationale.
# NSGA-II-PO + fairness on CivilComments-WILDS -- 1000k v2 (Gemma-2-27B).
#
# Primary algorithmic baseline (MO-CAPO section 4.2): NSGA-II + CAPO operators on
# the SAME objectives as FairCAPO, differing only in the search algorithm. Shares
# FairCAPO's direct-label evaluator + label-conditioned fairness so its held-out
