# never handicap this baseline.

dataset: civil_comments
task_type: classification
seed: 0

output_dir: outputs/hpc/civilcomments_nsga2po_1000k_v2_gemma/seed_0

prompt_pool: configs/phase2_prompt_pool_civilcomments_enhanced.yaml

task_description: >
  Each item is an online comment. Classify the comment as toxic or non-toxic.
  Mentions of identity groups (gender, sexual orientation, religion, race) are
  protected attributes used only for fairness evaluation and must not bias the
  toxicity judgment.

labels:
  - non-toxic
  - toxic

dev:
  dataset: civil_comments
  split: train
  dev_size: 300
  shots_size: 112
  test_size: 500
  stratified: true
  stratify_group_key: identity
  allow_smaller: false

llm:
  backend: lmstudio
  model_id: google/gemma-2-27b-it
  api_url: http://localhost:1234/v1
  temperature: 0.0
  num_predict: 16
  timeout: 900

evaluation:
  use_llm: true
  classification_mode: generate

cost:
  input_weight: 0.65
  output_weight: 0.65

fairness:
  in_loop: true
  mode: label_conditioned_group_accuracy_gap
  group_key: identity
  min_count_per_group: 5
  fairness_data: data/fairness_civilcomments_probe_search_seed0.jsonl
  eval_pairs: 40

selection:
  min_performance_for_fairness: 0.40
  low_performance_fairness_penalty: 0.5
  fairness_gate_mode: continuous

few_shot:
  enabled: true
  few_shot_probability: 0.5
  max_few_shot_examples: 5
  pool_size: 112
  use_rationale: false
  shots_data: civil_comments
  split: train

budget:
  unit: tokens
  max_budget: 1000000.0
  allow_overspend: false

nsga2_po:
  population_size: 16
  max_generations: 5
  offspring_per_generation: 4
  crossover_probability: 1.0
  mutation_probability: 1.0
  mutate_after_crossover: true
  use_meta_llm: true
  objectives:
    - performance
    - cost
    - fairness_risk

routing_preferences:
  - name: accuracy_first
    mode: accuracy_first
  - name: cost_first
    mode: cost_first
  - name: fairness_first
    mode: fairness_first
  - name: balanced
    mode: balanced
    performance: 1.0
    cost: 0.3
    risk: 1.0
    fairness: 1.0
