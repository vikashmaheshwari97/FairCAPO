# Adult Rocket 500k v2 cross-method comparison.
# FairCAPO v2 is compared with the completed v1 MO-CAPO and NSGA-II-PO runs.
# A representative row is one real prompt, selected only among candidates with
# held-out accuracy >= 0.70. nR2 uses the union of all eligible method fronts.

output_dir: outputs/experiment_table/adult_mistral_hpc_500k_v2_large_seed0
dataset: Adult
model: mistralai/mistral-small-3.2
seed: 0

objectives:
  - name: performance
    direction: maximize
  - name: cost
    direction: minimize
  - name: fairness_risk
    direction: minimize

bounds:
  performance: [0.0, 1.0]
  cost: [0.0, 24000.0]
  risk: [0.0, 1.0]
  fairness_risk: [0.0, 1.0]

metrics:
  num_preference_vectors: 500
  seed: 0

selection:
  min_performance_for_fairness: 0.70
  representative_policy: min_fairness_then_max_performance_then_min_cost

methods:
  - name: FairCAPO
    type: pareto_set
    candidates_csv: outputs/hpc/evaluation_large/seed_0/adult_faircapo_500k_v2/test_eval_candidates.csv
    only_pareto: true
    budget_json: outputs/hpc/adult_faircapo_500k_v2/seed_0/budget_summary.json

  - name: MO-CAPO (fairness off)
    type: pareto_set
    candidates_csv: outputs/hpc/evaluation_large/seed_0/adult_ablation_500k_v1/test_eval_candidates.csv
    only_pareto: true
    budget_json: outputs/hpc/adult_ablation_500k_v1/seed_0/budget_summary.json

  - name: NSGA-II-PO + fairness
    type: pareto_set
    candidates_csv: outputs/hpc/evaluation_large/seed_0/adult_nsga2po_500k_v1/test_eval_candidates.csv
    only_pareto: true
    budget_json: outputs/hpc/adult_nsga2po_500k_v1/seed_0/budget_summary.json
