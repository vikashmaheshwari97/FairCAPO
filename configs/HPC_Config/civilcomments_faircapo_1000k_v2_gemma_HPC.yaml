# hand-edit; change the generator and re-run. Derived from the frozen
# civilcomments_faircapo_500k_v1_gemma_HPC.yaml with paper-faithful v2 knobs (block_size 30, k_max 5,
# few_shot_probability 0.5, eval_pairs 40, max_blocks 8) at the 1000k_v2
# token budget. See the generator docstring for the full rationale.
# FairCAPO on CivilComments-WILDS -- 1000k v2 (Gemma-2-27B, direct-label).
#
# Second FairCAPO showcase: a clean-trade-off, binary toxicity task that
# complements the hard 28-way BIOS showcase. Design choices vs BIOS:
#   - Binary toxic/non-toxic -> real accuracy headroom, cheap eval.
#   - classification_mode: generate (no CoT). Binary needs no reasoning, so each
#     eval is cheap and the 1000k v2 budget explores a real front (BIOS v2's CoT
#     starved the same budget into a degenerate 2-point front).
#   - Fairness = label_conditioned_group_accuracy_gap with group = identity,
#     label = toxicity. This is the WILDS 8-identity x toxicity worst-group gap:
#     a majority group cannot hide an unfair identity subgroup.
#   - Few-shot count (0/1/3) is the cost lever -> a rich multi-point Pareto front.
#
# Model is served by vLLM on Rocket (MODEL_PATH/SERVED_MODEL_NAME/MODEL_FAMILY=gemma
# exported by the pipeline script); the llm block below is the local-dev default.
# The WILDS CSV (all_data_with_identities.csv) must be on the node -- see the
# loader's FAIRCAPO_CIVILCOMMENTS_CSV / data/civilcomments/ default paths.

dataset: civil_comments
task_type: classification
seed: 0

output_dir: outputs/hpc/civilcomments_faircapo_1000k_v2_gemma/seed_0

prompt_pool: configs/phase2_prompt_pool_civilcomments_enhanced.yaml

task_description: >
  Each item is an online comment. Classify the comment as toxic or non-toxic.
  Mentions of identity groups (gender, sexual orientation, religion, race) are
  protected attributes used only for fairness evaluation and must not bias the
  toxicity judgment.

labels:
  - non-toxic
  - toxic

dev:
  dataset: civil_comments
  split: train
  dev_size: 300
  shots_size: 112
  test_size: 500
  stratified: true
  stratify_group_key: identity
  allow_smaller: false

llm:
  backend: lmstudio
  model_id: google/gemma-2-27b-it
  api_url: http://localhost:1234/v1
  temperature: 0.0
  num_predict: 16
  timeout: 900

evaluation:
  use_llm: true
  classification_mode: generate

cost:
  # Gemma-2-27B-it OpenRouter pricing (2026-07): $0.65/M input, $0.65/M output
  # (symmetric), vs Mistral-Small-3.2's $0.075/$0.20 -> weights 0.08/0.32.
  # Re-check current OpenRouter pricing before publishing final numbers.
  input_weight: 0.65
  output_weight: 0.65

fairness:
  in_loop: true
  mode: label_conditioned_group_accuracy_gap
  group_key: identity
  min_count_per_group: 5
  # Built once on the login node with scripts/build_civilcomments_fairness_probe.py.
  # Search-only probe; held-out eval must use the joint test split, not this file.
  fairness_data: data/fairness_civilcomments_probe_search_seed0.jsonl
  eval_pairs: 40

selection:
  # Continuous penalty, not a hard clamp:
  # adjusted_fairness = measured_fairness + 0.5 * max(0, 0.40 - accuracy)
  min_performance_for_fairness: 0.40
  low_performance_fairness_penalty: 0.5
  fairness_gate_mode: continuous

few_shot:
  enabled: true
  few_shot_probability: 0.5
  max_few_shot_examples: 5
  pool_size: 112
  use_rationale: false
  shots_data: civil_comments
  split: train

block_size: 30
drop_last_block: false
num_seed_blocks: 1

budget:
  unit: tokens
  max_budget: 1000000.0
  allow_overspend: false

evolutionary:
  population_size: 16
  max_iterations: 8
  offspring_per_iteration: 4
  crossover_probability: 1.0
  mutation_probability: 1.0
  mutate_after_crossover: true
  use_meta_llm: true
  require_prompt_tags: true
  preserve_output_format: true
  advance_after_iteration: true

intensification:
  max_blocks_per_challenger: 8
  reject_when_dominated: true
  accept_when_not_dominated_on_common_blocks: true
  add_rejected_to_population: true
  use_cache: true

dashboard:
  expected_event_types:
    - initial_population
    - evolutionary_intensification
    - environmental_selection
    - advance_incumbent

routing_preferences:
  - name: accuracy_first
    mode: accuracy_first
  - name: cost_first
    mode: cost_first
  - name: fairness_first
    mode: fairness_first
  - name: balanced
    mode: balanced
    performance: 1.0
    cost: 0.3
    risk: 1.0
    fairness: 1.0
