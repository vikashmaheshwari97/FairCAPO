dataset: civil_comments
task_type: classification
seed: 0

output_dir: outputs/hpc/civilcomments_ablation_5000k_v2_gemma/seed_0

prompt_pool: configs/phase2_prompt_pool_civilcomments_enhanced.yaml

task_description: >
  Each item is an online comment. Classify the comment as toxic or non-toxic.
  Mentions of identity groups (gender, sexual orientation, religion, race) are
  protected attributes used only for fairness evaluation and must not bias the
  toxicity judgment.

labels:
  - non-toxic
  - toxic

dev:
  dataset: civil_comments
  split: train
  dev_size: 300
  shots_size: 112
  test_size: 500
  stratified: true
  stratify_group_key: identity
  allow_smaller: false

llm:
  backend: lmstudio
  model_id: google/gemma-2-27b-it
  api_url: http://localhost:1234/v1
  temperature: 0.0
  num_predict: 16
  timeout: 900

evaluation:
  use_llm: true
  classification_mode: generate

cost:
  input_weight: 0.65
  output_weight: 0.65

fairness:
  in_loop: false
  mode: group_accuracy_gap
  group_key: identity
  group_gap_weight: 1.0
  flip_weight: 0.0
  bias_weight: 0.0
  debt_weight: 0.0

few_shot:
  enabled: true
  few_shot_probability: 0.5
  max_few_shot_examples: 5
  pool_size: 112
  use_rationale: false
  shots_data: civil_comments
  split: train

block_size: 30
drop_last_block: false
num_seed_blocks: 1

budget:
  unit: tokens
  max_budget: 5000000.0
  allow_overspend: false

evolutionary:
  population_size: 16
  max_iterations: 8
  offspring_per_iteration: 4
  crossover_probability: 1.0
  mutation_probability: 1.0
  mutate_after_crossover: true
  use_meta_llm: true
  require_prompt_tags: true
  preserve_output_format: true
  advance_after_iteration: true

intensification:
  max_blocks_per_challenger: 8
  reject_when_dominated: true
  accept_when_not_dominated_on_common_blocks: true
  add_rejected_to_population: true
  use_cache: true

routing_preferences:
  - name: accuracy_first
    mode: accuracy_first
  - name: cost_first
    mode: cost_first
  - name: balanced
    mode: balanced
    performance: 1.0
    cost: 0.3
    risk: 1.0
    fairness: 1.0
