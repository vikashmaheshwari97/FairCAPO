# Large-held-out evaluation for Bias-in-Bios guided NSGA-II-PO 500k v1.

experiment_name: bios_eval_nsga_large_guided_500k_v1

portfolio_csv: outputs/hpc/bios_nsga2po_guided_500k_v1/seed_0/nsga2_po_pareto_portfolio.csv
output_dir: outputs/hpc/evaluation_large/seed_0/bios_nsga2po_guided_500k_v1

dataset: bias_in_bios
task_type: classification
seed: 0
dev_size: 75
shots_size: 25
test_size: 500
stratified: true
allow_smaller: false

labels:
  - accountant
  - architect
  - attorney
  - chiropractor
  - comedian
  - composer
  - dentist
  - dietitian
  - dj
  - filmmaker
  - interior_designer
  - journalist
  - model
  - nurse
  - painter
  - paralegal
  - pastor
  - personal_trainer
  - photographer
  - physician
  - poet
  - professor
  - psychologist
  - rapper
  - software_engineer
  - surgeon
  - teacher
  - yoga_teacher

evaluation:
  use_llm: true
  require_final_answer_tags: true
  label_guidance: bios_profession_boundaries

fairness:
  in_loop: true
  mode: group_accuracy_gap
  group_key: gender
  group_gap_weight: 1.0
  flip_weight: 0.0
  bias_weight: 0.0
  debt_weight: 0.0

llm:
  backend: lmstudio
  model_id: mistralai/mistral-small-3.2
  api_url: http://localhost:1234/v1
  temperature: 0.0
  num_predict: 32
  timeout: 900

cost:
  input_weight: 0.08
  output_weight: 0.32

objectives:
  - name: performance
    direction: maximize
  - name: cost
    direction: minimize
  - name: fairness_risk
    direction: minimize

bounds:
  performance: [0.0, 1.0]
  cost: [0.0, 12000.0]
  risk: [0.0, 1.0]
  fairness_risk: [0.0, 1.0]

metrics:
  num_preference_vectors: 500
  seed: 0
