# Adult v4 Qwen retrieval search profile.
# IMPORTANT: keep this 4M profile for reproducibility, but do not submit it until
# the fixed-prompt retrieval ablation confirms that Qwen benefits from retrieval.

dataset: adult
task_type: classification
seed: 0
output_dir: outputs/hpc/adult_faircapo_qwen_retrieval_4m_v4/seed_0

# Use the v4 Adult seed pool. The previous file incorrectly used the stale v3 pool.
prompt_pool: configs/phase2_prompt_pool_adult_accuracy_v4.yaml

# This description is supplied to crossover/mutation. It must describe Adult,
# because a missing value previously let the shared runner use an unrelated task.
task_description: >
  Each input is a semantic text rendering of one Adult census record. Predict
  annual income as exactly <=50K or >50K using only non-protected economic and
  work-related evidence in the rendered record: ordinal education, occupation,
  work class, age, weekly hours, capital gain, capital loss, marital or household
  context, and native country when it is relevant to work opportunity. Sex and
  race are excluded from model prompts and retained only as metadata for
  equalized-odds evaluation. Improve concrete decision rules from observed
  development errors, avoid constant-label behaviour, and return exactly one
  configured label inside <final_answer> and </final_answer> tags.

labels:
  - "<=50K"
  - ">50K"

dev:
  dataset: adult
  data_path: data/adult_semantic_v3.csv
  split_manifest: data/adult_v4_fixed_split_seed0.json
  dev_size: 3000
  shots_size: 500
  test_size: 1000
  stratified: true
  stratify_group_key: sex
  allow_smaller: false

llm:
  backend: lmstudio
  model_id: Qwen/Qwen3-30B-A3B-Instruct-2507
  api_url: http://localhost:1234/v1
  temperature: 0.0
  num_predict: 192
  timeout: 900

evaluation:
  use_llm: true
  require_final_answer_tags: true
  classification_mode: generate

# Natural nearest neighbours are the primary method. Label-balanced retrieval is
# retained only as an explicitly selected ablation condition, not forced here.
retrieval:
  enabled: true
  k: 4
  policy: natural_similarity
  weights:
    education: 2.0
    education ordinal: 2.5
    occupation: 3.0
    work class: 1.5
    marital status: 0.5
    relationship: 0.5
    native country: 0.25
    capital gain: 2.5
    capital loss: 0.75
    hours per week: 1.25
    age: 0.75

# Retrieved examples are provided by the retrieval wrapper. Disable the separate
# random/static few-shot mechanism to avoid two competing demonstration systems.
few_shot:
  enabled: false
  few_shot_probability: 0.0
  max_few_shot_examples: 0

# Cost is a real objective. Zero weights previously made every candidate's cost
# identical and removed the accuracy/cost trade-off from Pareto selection.
cost:
  input_weight: 0.08
  output_weight: 0.32

fairness:
  in_loop: true
  mode: equalized_odds
  group_key: sex
  positive_label: ">50K"
  group_gap_weight: 0.0
  demographic_parity_weight: 0.0
  equal_opportunity_weight: 0.0
  equalized_odds_weight: 1.0
  flip_weight: 0.0
  bias_weight: 0.0
  debt_weight: 0.0

selection:
  # Report and optimize the raw fairness statistic. Accuracy is represented as a
  # separate feasibility floor rather than being added to fairness_risk.
  min_performance_for_fairness: 0.0
  low_performance_fairness_penalty: 0.0
  fairness_gate_mode: continuous
  min_performance_feasibility: 0.75

# Three initial blocks reduce one-block rejection noise. The runtime must honour
# min_blocks_before_reject before this profile is used for a new large run.
block_size: 100
drop_last_block: false
num_seed_blocks: 3

budget:
  unit: tokens
  max_budget: 4000000.0
  allow_overspend: false

bounds:
  performance: [0.0, 1.0]
  cost: [0.0, 200000.0]
  risk: [0.0, 1.0]
  fairness_risk: [0.0, 1.0]

evolutionary:
  population_size: 6
  max_iterations: 40
  offspring_per_iteration: 4
  crossover_probability: 1.0
  mutation_probability: 1.0
  mutate_after_crossover: true
  use_meta_llm: true
  require_prompt_tags: true
  preserve_output_format: true
  validate_prompt_instruction: true
  advance_after_iteration: true
  error_feedback_enabled: true
  exact_candidate_deduplication: true

intensification:
  # The previous value of 60 allowed the run to spend most of its budget
  # deepening incumbents. Keep the race shallow and disable the final full-depth
  # sweep. Rejection is permitted only after three common blocks.
  max_blocks_per_challenger: 8
  min_blocks_before_reject: 3
  reject_when_dominated: true
  accept_when_not_dominated_on_common_blocks: true
  add_rejected_to_population: false
  use_cache: true
  final_intensification: false

routing_preferences:
  - name: accuracy_first
    mode: accuracy_first
  - name: accuracy_fairness
    mode: balanced
    performance: 1.0
    cost: 0.10
    fairness: 0.70
