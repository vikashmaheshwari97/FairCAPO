# Aggregate CivilComments-WILDS large-held-out Dtest results -- 500k v1
# (Gemma-2-27B), Rocket layout.

base: outputs/hpc/evaluation_large/seed_{seed}
seeds: [0]
output_dir: outputs/experiment_table/civilcomments_gemma_hpc_500k_v1_large_seed0

methods:
  - name: FairCAPO
    eval_subdir: civilcomments_faircapo_500k_v1_gemma
  - name: MO-CAPO (fairness off)
    eval_subdir: civilcomments_ablation_500k_v1_gemma
  - name: NSGA-II-PO + fairness
    eval_subdir: civilcomments_nsga2po_500k_v1_gemma
