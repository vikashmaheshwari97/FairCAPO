# Adult NSGA-II-PO + fairness v3 -- same semantic data, prompt pool and
# 7.5M-token cap as FairCAPO v3, but full-dev NSGA-II evaluation.

dataset: adult
task_type: classification
seed: 0
output_dir: outputs/hpc/adult_nsga2po_7p5m_v3/seed_0

prompt_pool: configs/phase2_prompt_pool_adult_v3.yaml

task_description: >
  Each input is a semantic text rendering of an Adult census record. Predict
  annual income as exactly <=50K or >50K. Combine ordinal education, occupation,
  work class, age band, weekly hours, capital gain, capital loss, and household
  context. Protected sex and race are hidden from the prompt and available only
  for equalized-odds evaluation. Evolve concise prompts that improve predictive
  accuracy, retain diverse accuracy-cost trade-offs, avoid constant-label
  collapse, and apply one evidence threshold consistently across groups.

labels:
  - "<=50K"
  - ">50K"

dev:
  dataset: adult
  data_path: data/adult_semantic_v3.csv
  dev_size: 800
  shots_size: 200
  test_size: 2000
  stratified: true
  stratify_group_key: sex
  allow_smaller: false

llm:
  backend: lmstudio
  model_id: mistralai/mistral-small-3.2
  api_url: http://localhost:1234/v1
  temperature: 0.0
  num_predict: 24
  timeout: 900

evaluation:
  use_llm: true
  require_final_answer_tags: true

cost:
  input_weight: 0.08
  output_weight: 0.32

fairness:
  in_loop: true
  mode: equalized_odds
  group_key: sex
  positive_label: ">50K"
  group_gap_weight: 0.0
  demographic_parity_weight: 0.0
  equal_opportunity_weight: 0.0
  equalized_odds_weight: 1.0
  flip_weight: 0.0
  bias_weight: 0.0
  debt_weight: 0.0

selection:
  min_performance_for_fairness: 0.72
  low_performance_fairness_penalty: 1.0
  fairness_gate_mode: continuous

few_shot:
  enabled: true
  few_shot_probability: 0.5
  max_few_shot_examples: 5
  pool_size: 200
  use_rationale: true
  shots_data: adult
  data_path: data/adult_semantic_v3.csv
  stratified: true
  stratify_group_key: sex
  selection_strategy: fairness_guided
  group_key: sex

budget:
  unit: tokens
  max_budget: 7500000.0
  allow_overspend: false

nsga2_po:
  population_size: 10
  max_generations: 2000
  offspring_per_generation: 4
  crossover_probability: 1.0
  mutation_probability: 1.0
  mutate_after_crossover: true
  use_meta_llm: true
  objectives:
    - performance
    - cost
    - fairness_risk

routing_preferences:
  - name: accuracy_first
    mode: accuracy_first
  - name: cost_first
    mode: cost_first
  - name: fairness_first
    mode: fairness_first
  - name: balanced
    mode: balanced
    performance: 1.0
    cost: 0.3
    fairness: 1.0
