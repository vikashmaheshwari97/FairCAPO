# Large-held-out evaluation for Adult NSGA-II-PO + fairness 500k v1.

experiment_name: adult_eval_nsga_large_500k_v1

portfolio_csv: outputs/hpc/adult_nsga2po_500k_v1/seed_0/nsga2_po_pareto_portfolio.csv
output_dir: outputs/hpc/evaluation_large/seed_0/adult_nsga2po_500k_v1

dataset: adult
data_path: data/adult.csv
task_type: classification
seed: 0
dev_size: 400
shots_size: 100
test_size: 1000
stratified: true
stratify_group_key: sex
allow_smaller: false

labels:
  - "<=50K"
  - ">50K"

evaluation:
  use_llm: true
  require_final_answer_tags: true

fairness:
  in_loop: true
  mode: equalized_odds
  group_key: sex
  positive_label: ">50K"
  group_gap_weight: 0.0
  demographic_parity_weight: 0.0
  equal_opportunity_weight: 0.0
  equalized_odds_weight: 1.0
  flip_weight: 0.0
  bias_weight: 0.0
  debt_weight: 0.0

llm:
  backend: lmstudio
  model_id: mistralai/mistral-small-3.2
  api_url: http://localhost:1234/v1
  temperature: 0.0
  num_predict: 16
  timeout: 900

cost:
  input_weight: 0.08
  output_weight: 0.32

objectives:
  - name: performance
    direction: maximize
  - name: cost
    direction: minimize
  - name: fairness_risk
    direction: minimize

bounds:
  performance: [0.0, 1.0]
  cost: [0.0, 24000.0]
  risk: [0.0, 1.0]
  fairness_risk: [0.0, 1.0]

metrics:
  num_preference_vectors: 500
  seed: 0
