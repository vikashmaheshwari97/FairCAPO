# FairCAPO on Bias-in-Bios -- label-conditioned fairness, Rocket 500k seed-0.
#
# Controlled run after BIOS v1. It keeps the stable v1 search scale, but uses
# label-conditioned group accuracy gap and a performance gate so collapsed
# classifiers cannot win only because their fairness gap is low.

dataset: bias_in_bios
task_type: classification
seed: 0

output_dir: outputs/hpc/bios_faircapo_labelaware_500k_v1/seed_0

prompt_pool: configs/phase2_prompt_pool_bios.yaml

task_description: >
  Each item is a short biography. Predict the person's profession from the
  biography text. Gender is a protected attribute used only for fairness
  evaluation and should not be used as a shortcut for the profession.

labels:
  - accountant
  - architect
  - attorney
  - chiropractor
  - comedian
  - composer
  - dentist
  - dietitian
  - dj
  - filmmaker
  - interior_designer
  - journalist
  - model
  - nurse
  - painter
  - paralegal
  - pastor
  - personal_trainer
  - photographer
  - physician
  - poet
  - professor
  - psychologist
  - rapper
  - software_engineer
  - surgeon
  - teacher
  - yoga_teacher

dev:
  dataset: bias_in_bios
  split: train
  dev_size: 75
  shots_size: 25
  test_size: 100
  stratified: true
  allow_smaller: false

llm:
  backend: lmstudio
  model_id: mistralai/mistral-small-3.2
  api_url: http://localhost:1234/v1
  temperature: 0.0
  num_predict: 32
  timeout: 900

evaluation:
  use_llm: true
  require_final_answer_tags: true

cost:
  input_weight: 0.08
  output_weight: 0.32

fairness:
  in_loop: true
  mode: label_conditioned_group_accuracy_gap
  group_key: gender
  min_count_per_group: 5
  # Built once on the login node with scripts/build_bios_fairness_probe.py.
  # Gives search a stable, support-balanced label-conditioned fairness signal.
  fairness_data: data/fairness_bios_probe_seed0.jsonl
  eval_pairs: 80

selection:
  # Continuous penalty, not a hard clamp:
  # adjusted_fairness = measured_fairness + 0.5 * max(0, 0.40 - accuracy)
  min_performance_for_fairness: 0.40
  low_performance_fairness_penalty: 0.5
  fairness_gate_mode: continuous

few_shot:
  enabled: true
  few_shot_probability: 0.3
  max_few_shot_examples: 3
  pool_size: 25
  use_rationale: false
  shots_data: bias_in_bios
  split: train

block_size: 15
drop_last_block: false
num_seed_blocks: 1

budget:
  unit: tokens
  max_budget: 500000.0
  allow_overspend: false

evolutionary:
  population_size: 16
  max_iterations: 8
  offspring_per_iteration: 4
  crossover_probability: 1.0
  mutation_probability: 1.0
  mutate_after_crossover: true
  use_meta_llm: true
  require_prompt_tags: true
  preserve_output_format: true
  advance_after_iteration: true

intensification:
  max_blocks_per_challenger: 5
  reject_when_dominated: true
  accept_when_not_dominated_on_common_blocks: true
  add_rejected_to_population: true
  use_cache: true

dashboard:
  expected_event_types:
    - initial_population
    - evolutionary_intensification
    - environmental_selection
    - advance_incumbent

routing_preferences:
  - name: accuracy_first
    mode: accuracy_first
  - name: cost_first
    mode: cost_first
  - name: fairness_first
    mode: fairness_first
  - name: balanced
    mode: balanced
    performance: 1.0
    cost: 0.3
    risk: 1.0
    fairness: 1.0
