# NSGA-II-PO + label-conditioned group fairness on Bias-in-Bios -- Rocket 500k smoke v2 seed 0.

dataset: bias_in_bios
task_type: classification
seed: 0

output_dir: outputs/hpc/bios_nsga2po_500k_smoke_v2/seed_0

prompt_pool: configs/phase2_prompt_pool_bios.yaml

initial_prompt_ids:
  - cheap_direct
  - accuracy_role_evidence
  - risk_no_guess
  - fairness_gender_blind

task_description: >
  Each item is a short biography. Predict the person's profession from the
  biography text. Gender is a protected attribute used only for fairness
  evaluation and should not be used as a shortcut for the profession.

labels:
  - accountant
  - architect
  - attorney
  - chiropractor
  - comedian
  - composer
  - dentist
  - dietitian
  - dj
  - filmmaker
  - interior_designer
  - journalist
  - model
  - nurse
  - painter
  - paralegal
  - pastor
  - personal_trainer
  - photographer
  - physician
  - poet
  - professor
  - psychologist
  - rapper
  - software_engineer
  - surgeon
  - teacher
  - yoga_teacher

dev:
  dataset: bias_in_bios
  split: train
  dev_size: 280
  shots_size: 112
  test_size: 500
  stratified: true
  stratify_group_key: gender
  allow_smaller: false

llm:
  backend: lmstudio
  model_id: mistralai/mistral-small-3.2
  api_url: http://localhost:1234/v1
  temperature: 0.0
  num_predict: 32
  timeout: 900

evaluation:
  use_llm: true
  require_final_answer_tags: true

cost:
  input_weight: 0.08
  output_weight: 0.32

budget:
  unit: tokens
  max_budget: 500000.0
  allow_overspend: false

fairness:
  in_loop: true
  mode: label_conditioned_group_accuracy_gap
  group_key: gender
  min_count_per_group: 5
  fairness_data: data/fairness_bios_probe_search_seed0.jsonl
  eval_pairs: 80

selection:
  min_performance_for_fairness: 0.40
  low_performance_fairness_penalty: 0.5
  fairness_gate_mode: continuous

few_shot:
  enabled: true
  few_shot_probability: 0.3
  max_few_shot_examples: 3
  pool_size: 112
  use_rationale: false
  shots_data: bias_in_bios
  split: train

nsga2_po:
  population_size: 4
  max_generations: 1
  offspring_per_generation: 1
  crossover_probability: 1.0
  mutation_probability: 1.0
  mutate_after_crossover: true
  use_meta_llm: true
  objectives:
    - performance
    - cost
    - fairness_risk

routing_preferences:
  - name: accuracy_first
    mode: accuracy_first
  - name: cost_first
    mode: cost_first
  - name: fairness_first
    mode: fairness_first
  - name: balanced
    mode: balanced
    performance: 1.0
    cost: 0.3
    risk: 1.0
    fairness: 1.0
