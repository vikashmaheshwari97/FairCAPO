# NSGA-II-PO + group fairness on Bias-in-Bios -- Rocket 500k v1 seed 0.

dataset: bias_in_bios
task_type: classification
seed: 0

output_dir: outputs/hpc/bios_nsga2po_500k_v1/seed_0

prompt_pool: configs/phase2_prompt_pool_bios.yaml

task_description: >
  Each item is a short biography. Predict the person's profession from the
  biography text. Gender is a protected attribute used only for fairness
  evaluation and should not be used as a shortcut for the profession.

labels:
  - accountant
  - architect
  - attorney
  - chiropractor
  - comedian
  - composer
  - dentist
  - dietitian
  - dj
  - filmmaker
  - interior_designer
  - journalist
  - model
  - nurse
  - painter
  - paralegal
  - pastor
  - personal_trainer
  - photographer
  - physician
  - poet
  - professor
  - psychologist
  - rapper
  - software_engineer
  - surgeon
  - teacher
  - yoga_teacher

dev:
  dataset: bias_in_bios
  dev_size: 75
  shots_size: 25
  test_size: 100
  stratified: true
  allow_smaller: false

llm:
  backend: lmstudio
  model_id: mistralai/mistral-small-3.2
  api_url: http://localhost:1234/v1
  temperature: 0.0
  num_predict: 32
  timeout: 900

evaluation:
  use_llm: true
  require_final_answer_tags: true

cost:
  input_weight: 0.08
  output_weight: 0.32

fairness:
  in_loop: true
  mode: group_accuracy_gap
  group_key: gender
  group_gap_weight: 1.0
  flip_weight: 0.0
  bias_weight: 0.0
  debt_weight: 0.0

nsga2_po:
  population_size: 16
  max_generations: 5
  offspring_per_generation: 4
  crossover_probability: 1.0
  mutation_probability: 1.0
  mutate_after_crossover: true
  use_meta_llm: true
  objectives:
    - performance
    - cost
    - fairness_risk

routing_preferences:
  - name: accuracy_first
    mode: accuracy_first
  - name: cost_first
    mode: cost_first
  - name: fairness_first
    mode: fairness_first
  - name: balanced
    mode: balanced
    performance: 1.0
    cost: 0.3
    risk: 1.0
    fairness: 1.0
