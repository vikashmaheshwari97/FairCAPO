# FairCAPO on Adult income -- Rocket 500k v2.
#
# v2 keeps the same shared initial prompt pool and held-out protocol as v1, but
# prevents collapsed low-accuracy classifiers from looking artificially fair
# and uses label/group-balanced few-shot sampling inside the FairCAPO layer.

dataset: adult
task_type: classification
seed: 0

output_dir: outputs/hpc/adult_faircapo_500k_v2/seed_0

prompt_pool: configs/phase2_prompt_pool_adult.yaml
initial_prompt_ids:
  - cheap_direct
  - cheap_economic_evidence
  - baseline_income_classifier
  - accuracy_income_evidence
  - accuracy_threshold_reasoning
  - fairness_unaware_evidence
  - fairness_equalized_odds
  - risk_no_shortcuts
  - balanced_income_fair
  - expensive_audit_income

task_description: >
  Each item is a person record from the Adult income dataset rendered as text.
  Predict whether annual income is <=50K or >50K using employment, education,
  working-hours, and financial evidence. Sex and race are protected attributes
  used only for fairness evaluation and are not included in the main prompt
  input. During prompt evolution, preserve or improve predictive accuracy, keep
  the instruction concise to control inference cost, and apply the same
  evidence threshold to every person so false-positive and false-negative gaps
  across sex groups are reduced. Never remove the explicit income-classification
  task or the two allowed labels.

labels:
  - "<=50K"
  - ">50K"

dev:
  dataset: adult
  data_path: data/adult.csv
  dev_size: 400
  shots_size: 100
  test_size: 1000
  stratified: true
  stratify_group_key: sex
  allow_smaller: false

llm:
  backend: lmstudio
  model_id: mistralai/mistral-small-3.2
  api_url: http://localhost:1234/v1
  temperature: 0.0
  num_predict: 16
  timeout: 900

evaluation:
  use_llm: true
  require_final_answer_tags: true

cost:
  input_weight: 0.08
  output_weight: 0.32

fairness:
  in_loop: true
  mode: equalized_odds
  group_key: sex
  positive_label: ">50K"
  group_gap_weight: 0.0
  demographic_parity_weight: 0.0
  equal_opportunity_weight: 0.0
  equalized_odds_weight: 1.0
  flip_weight: 0.0
  bias_weight: 0.0
  debt_weight: 0.0

# Fairness is meaningful only for prompts that remain useful classifiers.
# A zero-accuracy constant predictor therefore receives a large fairness penalty
# instead of entering the Pareto front with an artificial fairness score of 0.
selection:
  min_performance_for_fairness: 0.70
  low_performance_fairness_penalty: 1.0
  fairness_gate_mode: continuous

few_shot:
  enabled: true
  few_shot_probability: 0.5
  max_few_shot_examples: 3
  pool_size: 100
  use_rationale: false
  shots_data: adult
  data_path: data/adult.csv
  stratified: true
  stratify_group_key: sex
  selection_strategy: fairness_guided
  group_key: sex

block_size: 100
drop_last_block: false
num_seed_blocks: 1

budget:
  unit: tokens
  max_budget: 500000.0
  allow_overspend: false

evolutionary:
  population_size: 10
  max_iterations: 8
  offspring_per_iteration: 3
  crossover_probability: 1.0
  mutation_probability: 1.0
  mutate_after_crossover: true
  use_meta_llm: true
  require_prompt_tags: true
  preserve_output_format: true
  advance_after_iteration: true

intensification:
  max_blocks_per_challenger: 4
  reject_when_dominated: true
  accept_when_not_dominated_on_common_blocks: true
  add_rejected_to_population: false
  use_cache: true
  final_intensification: true

routing_preferences:
  - name: accuracy_first
    mode: accuracy_first
  - name: cost_first
    mode: cost_first
  - name: fairness_first
    mode: fairness_first
  - name: balanced
    mode: balanced
    performance: 1.0
    cost: 0.3
    fairness: 1.0
