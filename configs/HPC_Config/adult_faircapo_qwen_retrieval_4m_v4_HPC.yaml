# Adult v4 accuracy-discovery run using Qwen3-30B-A3B-Instruct-2507.
# This changes the inference model and demonstration policy, so results must be
# reported separately from the Mistral v3 comparison.

dataset: adult
task_type: classification
seed: 0
output_dir: outputs/hpc/adult_faircapo_qwen_retrieval_4m_v4/seed_0
prompt_pool: configs/phase2_prompt_pool_adult_accuracy_v3.yaml

labels:
  - "<=50K"
  - ">50K"

dev:
  dataset: adult
  data_path: data/adult_semantic_v3.csv
  split_manifest: data/adult_v4_fixed_split_seed0.json
  dev_size: 3000
  shots_size: 500
  test_size: 1000
  stratified: true
  stratify_group_key: sex
  allow_smaller: false

llm:
  backend: lmstudio
  model_id: Qwen/Qwen3-30B-A3B-Instruct-2507
  api_url: http://localhost:1234/v1
  temperature: 0.0
  num_predict: 32
  timeout: 900

evaluation:
  use_llm: true
  require_final_answer_tags: true
  classification_mode: generate

retrieval:
  enabled: true
  k: 12
  policy: nonprotected_similarity_label_balanced
  weights:
    education: 3.0
    occupation: 3.0
    work class: 2.0
    capital gain: 2.5
    hours per week: 1.5
    age: 1.0

# Static demonstrations are disabled. The retrieval evaluator selects 12
# label-balanced examples independently for every query using only non-protected
# fields. Sex and race never enter the similarity score or prompt text.
few_shot:
  enabled: false
  max_few_shot_examples: 0

cost:
  input_weight: 0.0
  output_weight: 0.0

fairness:
  in_loop: true
  mode: equalized_odds
  group_key: sex
  positive_label: ">50K"
  equalized_odds_weight: 1.0

selection:
  min_performance_for_fairness: 0.80
  low_performance_fairness_penalty: 1.0
  fairness_gate_mode: continuous

block_size: 50
drop_last_block: false
num_seed_blocks: 1

budget:
  unit: tokens
  max_budget: 4000000.0
  allow_overspend: false

bounds:
  performance: [0.0, 1.0]
  cost: [0.0, 1.0]
  risk: [0.0, 1.0]
  fairness_risk: [0.0, 1.0]

evolutionary:
  population_size: 6
  max_iterations: 60
  offspring_per_iteration: 4
  crossover_probability: 1.0
  mutation_probability: 1.0
  mutate_after_crossover: true
  use_meta_llm: true
  require_prompt_tags: true
  preserve_output_format: true
  validate_prompt_instruction: true
  advance_after_iteration: true

intensification:
  max_blocks_per_challenger: 60
  reject_when_dominated: true
  accept_when_not_dominated_on_common_blocks: true
  add_rejected_to_population: false
  use_cache: true
  final_intensification: true

routing_preferences:
  - name: accuracy_first
    mode: accuracy_first
  - name: accuracy_fairness
    mode: balanced
    performance: 1.0
    cost: 0.0
    fairness: 0.7
