# Active Adult v4 accuracy-discovery seed pool.
# All entries are instruction seeds. Dynamic retrieval is configured separately,
# so the IDs and metadata do not claim a fixed number of demonstrations.

dataset: adult
task_type: classification
version: adult_accuracy_v4
seed: 0
protected_fields_excluded:
  - sex
  - race
output_format: "<final_answer>LABEL</final_answer>"

labels:
  - "<=50K"
  - ">50K"

prompt_pool:
  - id: calibrated_tree
    category: accuracy_first
    cost_level: cheap
    few_shot_count: 0
    prompt: >
      Predict whether annual income is <=50K or >50K from the supplied person
      record. Use a calibrated decision tree: treat a substantial or very high
      capital gain as strong >50K evidence; otherwise combine ordinal education,
      occupation, work class, weekly hours, age, capital loss, and household
      context. Executive/managerial or professional work, incorporated
      self-employment, education level 13 or higher, and long hours support
      >50K. Low education, service/routine work, part-time hours, and no capital
      income support <=50K. Resolve conflicts using the number and strength of
      independent signals. Return exactly one label inside <final_answer> tags.

  - id: asymmetric_error_control
    category: accuracy_first
    cost_level: cheap
    few_shot_count: 0
    prompt: >
      Classify income as <=50K or >50K. Do not default automatically to <=50K:
      actively look for strong positive evidence such as capital gain,
      executive-managerial or professional-specialty work, incorporated
      self-employment, advanced education, and extended working hours. Predict
      >50K when several strong positive signals agree; otherwise prefer <=50K.
      Return only the tagged label.

  - id: weighted_evidence
    category: accuracy_first
    cost_level: medium
    few_shot_count: 0
    prompt: >
      Apply a weighted evidence score. Add strong weight for substantial capital
      gain, executive-managerial or professional-specialty occupation,
      incorporated self-employment, and ordinal education 13-16. Add moderate
      weight for technical or sales work, federal employment, age 30-60, and
      more than 40 weekly hours. Subtract weight for ordinal education 1-9,
      service/handler/private-household work, part-time hours, and absence of
      positive capital evidence. Use marital and relationship information only
      as weak secondary context. Predict >50K only when the positive total
      clearly exceeds the negative total. Return one label in
      <final_answer>...</final_answer>.

  - id: interaction_rules
    category: accuracy_first
    cost_level: medium
    few_shot_count: 0
    prompt: >
      Predict annual income by evaluating feature interactions rather than
      isolated fields. Advanced education is most persuasive when paired with
      professional, technical, executive, managerial, sales, government, or
      incorporated self-employment evidence. Long hours matter most when paired
      with a skilled occupation. Capital gain can override otherwise mixed
      evidence. Conversely, low education plus service/routine work, limited
      hours, and no capital gain strongly supports <=50K. Use the same rule for
      every record and output exactly one tagged label.

  - id: high_income_recall
    category: accuracy_first
    cost_level: medium
    few_shot_count: 0
    prompt: >
      Compare explicit evidence for both income brackets. Before choosing
      <=50K, verify that the record lacks a strong >50K combination such as
      capital gain, advanced education with skilled/professional work,
      executive-managerial responsibility, incorporated self-employment, or
      sustained long working hours. Before choosing >50K, require at least one
      strong signal or several mutually reinforcing moderate signals. Avoid
      constant-label behavior. Return only <=50K or >50K inside
      <final_answer> tags.

  - id: fair_calibrated
    category: balanced
    cost_level: medium
    few_shot_count: 0
    prompt: >
      Apply one calibrated economic-evidence rule to every record. Base the
      decision chiefly on capital gain/loss, ordinal education, occupation, work
      class, weekly hours, and age. Treat marital status, relationship, and
      native country as secondary context rather than decisive evidence. Balance
      false positives and false negatives, require coherent evidence for >50K,
      and do not suppress a well-supported >50K prediction. Return exactly one
      label inside <final_answer> and </final_answer> tags.
