# Shared Adult v3 initial prompt pool for FairCAPO, MO-CAPO and NSGA-II-PO.
# All methods receive these same ten instructions. Protected attributes are
# metadata-only and never appear in the rendered record.

dataset: adult
task_type: classification
seed: 0

labels:
  - "<=50K"
  - ">50K"

prompt_pool:
  - id: direct_semantic
    category: cost_first
    cost_level: cheap
    few_shot_count: 0
    prompt: >
      Predict the annual income bracket from the person record. Return exactly
      one label, <=50K or >50K, inside <final_answer> tags.

  - id: concise_scorecard
    category: cost_first
    cost_level: cheap
    few_shot_count: 0
    prompt: >
      Combine education level, occupation, work class, weekly hours, age, and
      capital gain or loss to classify income as <=50K or >50K. Use no single
      field as an absolute rule. Return only the tagged label.

  - id: capital_priority
    category: accuracy_first
    cost_level: medium
    few_shot_count: 1
    prompt: >
      First check capital gain and capital loss, then combine education,
      occupation, work class, age, and hours. Positive capital income is strong
      evidence but must be interpreted with the other fields. Return only
      <final_answer><=50K</final_answer> or
      <final_answer>>50K</final_answer>.

  - id: education_occupation_interaction
    category: accuracy_first
    cost_level: medium
    few_shot_count: 2
    prompt: >
      Predict income using interactions rather than isolated features. Advanced
      education paired with professional, technical, executive, managerial, or
      incorporated self-employment evidence supports >50K; lower education,
      lower-skill work, and limited hours generally support <=50K. Resolve
      conflicts with capital income and work intensity. Return only the tagged
      label.

  - id: calibrated_income_scorecard
    category: accuracy_first
    cost_level: expensive
    few_shot_count: 3
    prompt: >
      Apply a calibrated evidence score. Strong >50K evidence includes recorded
      capital gain, high ordinal education, executive-managerial or professional
      specialty work, incorporated self-employment, and extended work hours.
      Strong <=50K evidence includes low ordinal education, part-time hours,
      service or routine manual work, and no capital income. Combine all evidence
      and do not let one weak signal override several strong signals. Return only
      the final tagged label.

  - id: full_evidence_five_shot
    category: accuracy_first
    cost_level: expensive
    few_shot_count: 5
    prompt: >
      Carefully classify the income bracket by jointly evaluating age band,
      ordinal education level, work class, occupation, marital and household
      context, weekly hours, capital gain, and capital loss. Compare evidence for
      both labels, handle conflicting signals, and choose the better-supported
      result. Return only the answer inside <final_answer> tags.

  - id: fair_consistent_threshold
    category: fairness_first
    cost_level: medium
    few_shot_count: 2
    prompt: >
      Use the same economic-evidence threshold for every record. Base income on
      education, occupation, work class, hours, age, and capital gain or loss;
      never infer from protected demographics or stereotypes. Avoid a constant
      prediction and return only the tagged label.

  - id: fair_no_family_proxy
    category: fairness_first
    cost_level: medium
    few_shot_count: 3
    prompt: >
      Predict income primarily from education, occupation, work class, hours,
      age, and capital income. Treat marital status and relationship wording as
      weak context rather than decisive evidence because they can act as
      demographic proxies. Apply one calibrated rule to all records and return
      only <=50K or >50K inside <final_answer> tags.

  - id: balanced_error_control
    category: balanced
    cost_level: expensive
    few_shot_count: 4
    prompt: >
      Balance false positives and false negatives while maintaining accuracy.
      Require multiple mutually supporting economic signals before predicting
      >50K, but do not default to <=50K when strong education, occupation,
      work-intensity, or capital evidence is present. Use an identical rule for
      every record and return only the tagged label.

  - id: conservative_audit
    category: balanced
    cost_level: expensive
    few_shot_count: 5
    prompt: >
      Audit all non-protected economic evidence, compare the support for <=50K
      and >50K, and choose the label with the stronger combined case. Check for
      contradictory indicators, avoid demographic shortcuts and constant-label
      behavior, and keep the final response to one label inside
      <final_answer> tags.
