# Adult income prompt pool for FairCAPO / MO-CAPO / NSGA-II-PO.
#
# Dataset: tabular census-style records rendered as text -> binary income class.
# Protected attributes: sex and race are metadata only in the main setting.

dataset: adult
task_type: classification
seed: 0

labels:
  - "<=50K"
  - ">50K"

task_description: >
  Each item is a person record from the Adult income dataset rendered as text.
  Predict whether annual income is <=50K or >50K using employment, education,
  working-hours, and financial evidence. Sex and race are protected attributes
  used only for fairness evaluation and are not included in the main prompt
  input.

prompt_pool:
  - id: cheap_direct
    category: cost_first
    cost_level: cheap
    few_shot_count: 0
    prompt: >
      Read the person record and predict annual income. Return exactly one label:
      <=50K or >50K.

  - id: cheap_economic_evidence
    category: cost_first
    cost_level: cheap
    few_shot_count: 0
    prompt: >
      Use the record's occupation, education, work class, hours per week, and
      capital gains or losses to choose the income label. Return only <=50K or
      >50K.

  - id: baseline_income_classifier
    category: baseline
    cost_level: medium
    few_shot_count: 1
    prompt: >
      Classify the annual income bracket from the provided record. Weigh stable
      economic evidence such as education, occupation, hours worked, work class,
      and capital income. Return only one allowed label.

  - id: accuracy_income_evidence
    category: accuracy_first
    cost_level: medium
    few_shot_count: 1
    prompt: >
      Identify income-relevant evidence in the record: job type, education,
      hours worked, capital gains, capital losses, work class, and marital or
      household context. Choose the better-supported income label and return
      only <=50K or >50K.

  - id: accuracy_threshold_reasoning
    category: accuracy_first
    cost_level: expensive
    few_shot_count: 3
    prompt: >
      Compare the evidence for income above 50K versus income at or below 50K.
      Strong indicators for >50K include high-skill occupations, advanced
      education, high hours, and capital gains; weak or missing economic
      evidence favors <=50K. Return only the final label.

  - id: fairness_unaware_evidence
    category: fairness_first
    cost_level: medium
    few_shot_count: 1
    prompt: >
      Predict income using only economic and work-related evidence. Do not rely
      on demographic stereotypes or demographic proxies. Apply the same evidence
      threshold for every person and return only <=50K or >50K.

  - id: fairness_equalized_odds
    category: fairness_first
    cost_level: medium
    few_shot_count: 1
    prompt: >
      Use a consistent decision rule that avoids systematically different false
      positive or false negative errors across protected groups. Base the label
      on occupation, education, hours, work class, and capital income only.
      Return exactly <=50K or >50K.

  - id: risk_no_shortcuts
    category: risk_first
    cost_level: medium
    few_shot_count: 1
    prompt: >
      Avoid shortcuts from marital role, relationship wording, or missing fields.
      Use concrete income evidence first: occupation, education, hours, work
      class, and capital gains or losses. Return one allowed label only.

  - id: balanced_income_fair
    category: balanced
    cost_level: medium
    few_shot_count: 1
    prompt: >
      Choose the income label that is best supported by the person's economic
      evidence while using the same standard for all records. Focus on work,
      education, hours, and capital income. Return only <=50K or >50K.

  - id: expensive_audit_income
    category: balanced
    cost_level: expensive
    few_shot_count: 3
    prompt: >
      Audit the record for income-relevant evidence, then choose between <=50K
      and >50K. Do not infer income from protected demographics or stereotypes.
      If the evidence is mixed, choose the label with stronger support. Return
      only the final label.
