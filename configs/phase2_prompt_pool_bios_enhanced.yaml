# Bias-in-Bios prompt pool for FairCAPO / MO-CAPO / NSGA-II-PO.
#
# Dataset: biography text -> profession classification.
# Protected attribute: gender, used only for group-fairness evaluation.

dataset: bias_in_bios
task_type: classification
seed: 0

labels:
  - accountant
  - architect
  - attorney
  - chiropractor
  - comedian
  - composer
  - dentist
  - dietitian
  - dj
  - filmmaker
  - interior_designer
  - journalist
  - model
  - nurse
  - painter
  - paralegal
  - pastor
  - personal_trainer
  - photographer
  - physician
  - poet
  - professor
  - psychologist
  - rapper
  - software_engineer
  - surgeon
  - teacher
  - yoga_teacher

task_description: >
  Each item is a short biography. Predict the person's profession from the
  biography text. Gender is a protected attribute used only for fairness
  evaluation and should not be used as a shortcut for the profession.

prompt_pool:
  - id: cheap_direct
    category: cost_first
    cost_level: cheap
    few_shot_count: 0
    prompt: >
      Read the biography and choose the most likely profession from the allowed
      labels. Return only the label.

  - id: cheap_evidence
    category: cost_first
    cost_level: cheap
    few_shot_count: 0
    prompt: >
      Use occupational evidence in the biography to select one allowed
      profession label. Return only the label.

  - id: baseline
    category: baseline
    cost_level: medium
    few_shot_count: 1
    prompt: >
      Classify the biography into exactly one profession label using the stated
      work, training, activities, and role evidence in the text.

  - id: accuracy_role_evidence
    category: accuracy_first
    cost_level: medium
    few_shot_count: 1
    prompt: >
      Identify concrete clues about the person's job duties, domain, credentials,
      workplace, publications, or professional activities. Choose the profession
      label best supported by those clues and return only that label.

  - id: accuracy_disambiguate
    category: accuracy_first
    cost_level: expensive
    few_shot_count: 3
    prompt: >
      Compare the biography evidence against the allowed profession labels.
      Prefer the label whose duties and domain are explicitly supported by the
      text. Think briefly about the strongest evidence, but return only the
      final label.

  - id: risk_no_guess
    category: risk_first
    cost_level: expensive
    few_shot_count: 3
    prompt: >
      Do not guess from weak signals. Use only direct occupational evidence in
      the biography. If several labels seem plausible, choose the one with the
      strongest textual support. Return one allowed label only.

  - id: risk_context_only
    category: risk_first
    cost_level: medium
    few_shot_count: 1
    prompt: >
      Base the classification only on facts in the biography. Ignore irrelevant
      personal details and choose the profession label most directly supported by
      the stated work or expertise.

  - id: fairness_gender_blind
    category: fairness_first
    cost_level: medium
    few_shot_count: 1
    prompt: >
      Classify the profession from job-related evidence only. Do not use gender,
      names, pronouns, or gender stereotypes as evidence for or against any
      occupation. Return only one allowed profession label.

  - id: fairness_equal_opportunity
    category: fairness_first
    cost_level: medium
    few_shot_count: 1
    prompt: >
      Treat biographies from all gender groups equally. Focus on skills,
      credentials, work activities, and domain terms, not gendered assumptions.
      Return the profession label best supported by the text.

  - id: fairness_counter_stereotype
    category: fairness_first
    cost_level: expensive
    few_shot_count: 3
    prompt: >
      Before choosing, check whether the answer relies on a gender stereotype.
      If so, discard that shortcut and use only occupational evidence in the
      biography. Return exactly one allowed profession label.

  - id: balanced_evidence_fair
    category: balanced
    cost_level: medium
    few_shot_count: 1
    prompt: >
      Choose the profession label supported by concrete role evidence in the
      biography. Avoid unsupported assumptions and ignore gender, pronouns, and
      stereotypes. Return only the label.

  - id: balanced_short
    category: balanced
    cost_level: cheap
    few_shot_count: 0
    prompt: >
      Use the biography's stated work and expertise, not demographic shortcuts,
      to select one profession label. Return only the allowed label.

  - id: accuracy_confusion_pairs
    category: accuracy_first
    cost_level: medium
    few_shot_count: 1
    prompt: >
      Predict the exact profession label from occupational evidence. Be careful
      with common confusions: surgeon performs operations, physician diagnoses
      or treats patients, nurse provides nursing care, professor conducts
      university research or teaching, teacher teaches school or classes,
      attorney practices law, paralegal supports legal work, journalist reports
      news, poet writes poetry, filmmaker makes films, photographer takes
      photographs. Return only one allowed label.

  - id: accuracy_label_taxonomy
    category: accuracy_first
    cost_level: medium
    few_shot_count: 1
    prompt: >
      First map the biography evidence to a profession family: medical, legal,
      education, arts/media, technology/design, fitness/nutrition, religion, or
      business. Then choose the most specific allowed label within that family.
      Use duties, credentials, workplace, publications, and produced work as
      evidence. Return only the final label.

  - id: accuracy_negative_evidence
    category: accuracy_first
    cost_level: expensive
    few_shot_count: 3
    prompt: >
      Choose the profession label that is best supported and reject labels whose
      required evidence is missing. For example, do not choose surgeon unless
      surgery or operations are stated; do not choose attorney unless legal
      practice is stated; do not choose professor unless academic research or
      university teaching is stated. Ignore names, pronouns, and stereotypes.
      Return exactly one allowed label.

  - id: fairness_specific_evidence
    category: fairness_first
    cost_level: medium
    few_shot_count: 1
    prompt: >
      Use the same profession-specific evidence standard for every gender group.
      Choose based on explicit duties, credentials, and outputs: operations for
      surgeon, patient diagnosis or treatment for physician, classroom teaching
      for teacher, university research or teaching for professor, legal practice
      for attorney, and legal assistance for paralegal. Return only one label.

  - id: balanced_exact_profession
    category: balanced
    cost_level: cheap
    few_shot_count: 0
    prompt: >
      Select the most specific allowed profession supported by the biography.
      Prefer exact role evidence over broad related labels and ignore gendered
      names or pronouns. Return only the label.
